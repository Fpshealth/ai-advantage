schema_version: "1.1"
name: escalation-de
description: >
  German user stuck on a supplier price update asks to escalate to the consultant. Tests the
  escalation skill end to end: handoff file written, mailto link with correct subject tag,
  umlaut survives URL encoding, no claim that the mail was sent, reply in German.
tags: [escalation, de]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Ich wollte die neuen Lieferantenpreise aus 01_Input/supplier-price-list-spring-2026.csv in 01_Input/current-shop-export.csv übernehmen, aber die Preisliste enthält Fehler (SG-2012: UVP 39,90 unter Einkaufspreis 44,00; SG-2013 doppelt; SG-2004 und SG-2009 ohne EAN). Ich komme nicht weiter, bitte an meinen Berater eskalieren. Nicht-interaktiver Lauf: verwende genau diesen Einzeiler als bestätigt: Die Preisliste enthält Fehler bei SG-2012, die ich nicht selbst entscheiden kann.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]

runs: 3

expected_outcome: >
  One escalation-handoff*.md in 03_Output quoting SG-2012 and the input files; a mailto link to
  federico.pacheco@fpshealth.com with subject tag [Escalation: Team-AI], fully URL-encoded
  (enth%C3%A4lt); the guide says a draft opens and only Send sends; everything in German.
