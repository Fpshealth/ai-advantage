schema_version: "1.1"
name: pruning-skills-vs-wfa
description: >
  Same planted fixture as pruning-skills-behaviour, but Matt Pocock's writing-for-agents text is in the
  working directory and the prompt says to follow it. Run with/without the plugin: the "without" arm is
  writing-for-agents alone, the "with" arm is both. Together with pruning-skills-behaviour this gives the
  four-way comparison nothing / writing-for-agents / pruning-skills / both. Behaviour test: a skill file carrying one instance of each
  cut-on-sight smell plus three load-bearing lines. Passes when the planted fluff is gone from the
  file, the load-bearing lines survive, and the reply reports cuts by failure-mode name with a
  word-count delta.
tags: [pruning-skills, behaviour, wfa]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    fixture-skill/SKILL.md feels bloated and full of fluff. Read writing-for-agents/SKILL.md first and follow it. Then tighten fixture-skill/SKILL.md in place and tell me what you cut.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]

runs: 3

expected_outcome: >
  fixture-skill/SKILL.md is edited in place: the date stamp, the IMP-005 reference, the
  "hold all findings" line and the OneDrive non-issue are gone; the EAN rule, the purchase-price
  rule and the check_listing.py command survive. The reply lists each cut with its failure-mode
  label and gives word count before → after.
