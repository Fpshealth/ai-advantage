<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --fg:#18202b; --muted:#566273; --line:#d8dee7;
  --accent:#2447a3; --accent-soft:#e6ecf8;
  --open:#8a5300; --open-soft:#fbf0dc;
  --ok:#1f6b43; --ok-soft:#e3f2ea; --bad:#a3321f; --bad-soft:#f9e6e2;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#19202a; --fg:#e5eaf1; --muted:#9ba7b7; --line:#2b3542;
  --accent:#8eabf2; --accent-soft:#1d2a45; --open:#f0b765; --open-soft:#3a2a12;
  --ok:#7fd1a3; --ok-soft:#15301f; --bad:#f19a88; --bad-soft:#3a1a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#19202a; --fg:#e5eaf1; --muted:#9ba7b7; --line:#2b3542;
  --accent:#8eabf2; --accent-soft:#1d2a45; --open:#f0b765; --open-soft:#3a2a12;
  --ok:#7fd1a3; --ok-soft:#15301f; --bad:#f19a88; --bad-soft:#3a1a14; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:600}
h2{font-size:1.55rem;font-weight:600;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:1.1rem;font-weight:600}
p{margin:0;max-width:66ch}
ul,ol{margin:0;padding-left:1.25em;max-width:66ch;display:flex;flex-direction:column;gap:6px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
header{display:flex;flex-direction:column;gap:12px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font:.85em var(--mono);background:var(--accent-soft);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.meta{font-size:.9rem;color:var(--muted)}
.lede{font-size:1.12rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* stamp */
.stamp{border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:.93rem;max-width:66ch}
.stamp b{font:600 .78rem/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.stamp.ok{background:var(--ok-soft);color:var(--ok);align-self:flex-start}
.stamp.bad{background:var(--bad-soft);color:var(--fg);border:1.5px solid var(--bad)}
.stamp.bad b{color:var(--bad)}
.stamp ol{gap:4px}
.stamp .q{color:var(--muted)}

/* pills */
.pill{display:inline-block;font:600 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:99px;vertical-align:2px;white-space:nowrap}
.pill.open{background:var(--open-soft);color:var(--open)}
.pill.confirm{background:var(--accent-soft);color:var(--accent)}
.est{color:var(--muted);font-size:.85em;white-space:nowrap}
.ask{color:var(--open)}
.ask q{font-style:normal}

/* key fact */
.key{background:var(--surface);border:1.5px solid var(--bad);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:66ch}
.key b{color:var(--bad)}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.num .k{font:600 .7rem/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num .v{font:600 1.35rem/1.15 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num .l{font-size:.85rem;line-height:1.4}
.num .s{font-size:.78rem;color:var(--muted);line-height:1.4}
.num.is-open{background:var(--open-soft);border-color:transparent}
.num.is-open .v{color:var(--open)}

/* trigger / result grid */
.facts{display:grid;grid-template-columns:9.5rem 1fr;gap:10px 18px;margin:0}
.facts dt{font:600 .76rem/1.9 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;min-width:0;max-width:66ch}
@media (max-width:560px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:10px}}

/* steps */
.steps{list-style:none;padding:0;gap:0;max-width:none}
.steps>li{position:relative;padding:16px 0 16px 3rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.steps>li:first-child{border-top:0}
.steps .nr{position:absolute;left:0;top:14px;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--bg);font:600 .9rem/2rem var(--mono);text-align:center}
.steps .do{font-weight:700;max-width:66ch}
.who{display:inline-block;font:600 .72rem/1 var(--mono);padding:3px 7px;border-radius:99px;background:var(--line);color:var(--fg);vertical-align:2px;margin-left:6px;font-weight:600}
.row{display:grid;grid-template-columns:6.5rem 1fr;gap:10px;max-width:66ch}
.row>span:first-child{font:600 .72rem/1.9 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row>span:last-child{min-width:0}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:0}}
.signal{border-left:3px solid var(--open);background:var(--open-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.93rem;max-width:66ch}
.signal b{color:var(--open)}

/* screenshots */
.shot{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.shot img{display:block;max-width:100%;max-height:560px;width:auto;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.shot figcaption{font-size:.85rem;color:var(--muted);line-height:1.45;max-width:66ch}
.tag{font:600 .7rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;margin-right:6px;display:inline-block}
.t-real{background:var(--accent-soft);color:var(--accent)}
.t-ph{background:var(--line);color:var(--fg)}
.frame{aspect-ratio:16/7;max-width:100%;border:1.5px dashed var(--muted);border-radius:6px;background:repeating-linear-gradient(135deg,var(--surface) 0 14px,var(--bg) 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;color:var(--muted)}
.frame .ft{font:600 .78rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}

/* cards: checks, files, roles */
.cards{list-style:none;padding:0;gap:12px;max-width:none}
.cards>li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cards h3{font-size:1.05rem}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw>div{min-width:0;font-size:.93rem}
.rw b{font:600 .72rem/1.8 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:block}
.rw .r b{color:var(--ok)} .rw .w b{color:var(--bad)}
@media (max-width:560px){.rw{grid-template-columns:1fr}}
.file.ph{border-style:dashed;border-color:var(--muted)}

/* lookup tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font:600 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* swimlane */
.lane{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.lane pre{margin:0}

/* plain lists */
.plain{list-style:none;padding:0;gap:12px}
.plain li{display:flex;flex-direction:column;gap:2px}
.openlist{list-style:none;padding:0;gap:10px;max-width:66ch}
.openlist li{position:relative;padding-left:2.2rem}
.openlist .on{position:absolute;left:0;top:1px;font:600 .8rem/1.5rem var(--mono);width:1.5rem;text-align:center;border-radius:4px;background:var(--open-soft);color:var(--open)}
.todo{list-style:none;padding:0;gap:6px}
.todo li::before{content:"☐ ";color:var(--muted)}
footer{font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
</style>
<div class="wrap"><!--stamp--><!--/stamp--><main>
<section data-section="kurz"><h2>Kurz gesagt</h2></section>
<section data-section="rahmen"><h2>Wann, was, wann fertig</h2></section>
<section data-section="systeme"><h2>Systeme und Zugang</h2></section>
<section data-section="vorbereiten"><h2>Vorher bereitlegen</h2></section>
<!-- nur für eine Prozessdokumentation; in einer SOP diesen Abschnitt löschen -->
<section data-section="rollen"><h2>Rollen und Übergaben</h2></section>
<section data-section="schritte"><h2>Schritte</h2></section>
<section data-section="pruefen"><h2>Prüfschritte</h2></section>
<section data-section="probleme"><h2>Wenn etwas schiefgeht</h2></section>
<section data-section="dateien"><h2>Echte Dateien</h2></section>
<section data-section="zahlen"><h2>Zahlen und Aufwand</h2></section>
<section data-section="offen"><h2>Noch offen</h2></section>
</main></div>
